services:
  quiz:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: databricks-quiz
    ports:
      - "8501:8501"
    volumes:
      # Mount the data folder so quiz_history.db and quiz files persist on the host
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
